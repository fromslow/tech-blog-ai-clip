<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>테크 블로그 AI 클리핑</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
<style>
  @font-face{
    font-family:'Pretendard Variable';font-style:normal;font-weight:45 920;font-display:swap;
    src:url('fonts/PretendardVariable.woff2') format('woff2-variations');
  }
  /* ── base-maia 프리셋 + stone 팔레트 (site-starter 톤) ── */
  :root{
    --background:oklch(1 0 0);
    --foreground:oklch(0.147 0.004 49.25);
    --card:oklch(1 0 0);
    --card-foreground:oklch(0.147 0.004 49.25);
    --primary:oklch(0.488 0.243 264.376);
    --primary-foreground:oklch(0.97 0.014 254.604);
    --secondary:oklch(0.967 0.001 286.375);
    --secondary-foreground:oklch(0.21 0.006 285.885);
    --muted:oklch(0.97 0.001 106.424);
    --muted-foreground:oklch(0.553 0.013 58.071);
    --accent:oklch(0.97 0.001 106.424);
    --border:oklch(0.923 0.003 48.717);
    --input:oklch(0.923 0.003 48.717);
    --ring:oklch(0.709 0.01 56.259);
    --radius:0.875rem;
    color-scheme:light;
  }
  html.dark{
    --background:oklch(0.147 0.004 49.25);
    --foreground:oklch(0.985 0.001 106.423);
    --card:oklch(0.216 0.006 56.043);
    --card-foreground:oklch(0.985 0.001 106.423);
    --primary:oklch(0.623 0.214 259.815);
    --primary-foreground:oklch(0.97 0.014 254.604);
    --secondary:oklch(0.274 0.006 286.033);
    --secondary-foreground:oklch(0.985 0 0);
    --muted:oklch(0.268 0.007 34.298);
    --muted-foreground:oklch(0.709 0.01 56.259);
    --accent:oklch(0.268 0.007 34.298);
    --border:oklch(1 0 0 / 12%);
    --input:oklch(1 0 0 / 15%);
    --ring:oklch(0.553 0.013 58.071);
    color-scheme:dark;
  }
  *{box-sizing:border-box;border-color:var(--border)}
  html,body{margin:0;padding:0}
  body{
    background:var(--background);color:var(--foreground);
    font-family:'Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;letter-spacing:-.01em;min-height:100svh;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:72rem;margin:0 auto;padding:0 20px}
  .scrollbar-none{scrollbar-width:none}
  .scrollbar-none::-webkit-scrollbar{display:none}
  .muted{color:var(--muted-foreground)}

  /* ── Header ── */
  header.nav{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);
    background:color-mix(in srgb,var(--background) 80%,transparent);backdrop-filter:blur(12px)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:-.02em}
  .brand .mark{width:24px;height:24px;border-radius:8px;
    background:linear-gradient(135deg,#4f46e5,#2563eb 45%,#0ea5e9)}
  .icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:calc(var(--radius)*.7);
    border:0;background:transparent;color:var(--foreground);cursor:pointer;font-size:18px;transition:background .15s}
  .icon-btn:hover{background:var(--muted)}

  /* ── Hero ── */
  .hero{padding:40px 0 24px}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--muted-foreground);margin:0}
  .hero-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 16px;margin-top:8px}
  h1{margin:0;font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.1}
  .hero-meta{color:var(--muted-foreground);font-size:14px;padding-bottom:5px;font-variant-numeric:tabular-nums}
  .hero-meta b{color:var(--foreground);font-weight:700}
  .lead{margin:12px 0 0;color:var(--muted-foreground);font-size:15px;line-height:1.6;max-width:640px}

  /* ── Toolbar (sticky) ── */
  .toolbar{position:sticky;top:56px;z-index:40;border-bottom:1px solid var(--border);
    background:color-mix(in srgb,var(--background) 90%,transparent);backdrop-filter:blur(12px)}
  .toolbar-in{padding-top:12px;padding-bottom:12px}
  .filterbar{display:flex;flex-direction:column;gap:10px}
  .search{position:relative}
  .search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);font-size:16px;pointer-events:none}
  .search input{width:100%;height:36px;padding:0 14px 0 36px;border:1px solid var(--input);
    border-radius:999px;background:color-mix(in srgb,var(--input) 30%,transparent);color:var(--foreground);
    font:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
  .search input::placeholder{color:var(--muted-foreground)}
  .search input:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 35%,transparent)}

  .chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0}
  @media(min-width:900px){.filterbar{flex-direction:row;align-items:center}.search{width:280px;flex:none}}
  .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
    border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted-foreground);
    font:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:color .15s,border-color .15s}
  .chip:hover{color:var(--foreground);border-color:color-mix(in srgb,var(--foreground) 25%,transparent)}
  .chip.on{border-color:transparent}
  .chip .cnt{font-size:11px;font-variant-numeric:tabular-nums;opacity:.6}
  .chip.on .cnt{opacity:.8}
  .clogo{width:18px;height:18px;border-radius:5px;object-fit:contain;background:#fff;flex-shrink:0;
    box-shadow:0 0 0 1px oklch(0 0 0 / .06)}
  .cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

  .tagrow{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
  .tagf{flex-shrink:0;border:0;border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600;
    background:var(--secondary);color:var(--secondary-foreground);cursor:pointer;white-space:nowrap;transition:.15s;opacity:.9}
  .tagf:hover{opacity:1}
  .tagf.on{background:var(--primary);color:var(--primary-foreground);opacity:1}

  /* ── Grid / Cards ── */
  main{padding-bottom:80px}
  .count{color:var(--muted-foreground);font-size:14px;margin:22px 0 16px}
  .count b{color:var(--foreground);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;background:var(--card);color:var(--card-foreground);
    border:1px solid var(--border);border-radius:calc(var(--radius)*1.6);overflow:hidden;cursor:pointer;
    transition:box-shadow .18s,border-color .18s,transform .18s}
  .card:hover{box-shadow:0 1px 2px oklch(0 0 0 / .05),0 8px 24px oklch(0 0 0 / .08);
    border-color:color-mix(in srgb,var(--foreground) 14%,transparent);transform:translateY(-2px)}
  .thumb{position:relative;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;background:var(--muted)}
  .thumb .ph{position:absolute;inset:0;display:grid;place-items:center}
  .thumb .ph span{font-size:22px;font-weight:800;letter-spacing:-.02em;opacity:.5}
  .thumb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .card:hover .thumb>img{transform:scale(1.04)}
  .badge{position:absolute;left:10px;top:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;
    height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;
    background:color-mix(in srgb,var(--background) 85%,transparent);backdrop-filter:blur(6px);
    color:var(--foreground);border:1px solid var(--border)}
  .badge .cdot{width:7px;height:7px}
  .new{position:absolute;right:10px;top:10px;z-index:2;height:22px;padding:0 8px;border-radius:999px;
    display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.03em;
    background:var(--primary);color:var(--primary-foreground)}
  .cbody{padding:14px 15px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
  .ctitle{margin:0;font-size:15px;font-weight:700;line-height:1.4;letter-spacing:-.015em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card:hover .ctitle{text-decoration:underline;text-underline-offset:2px}
  .ctitle i{font-size:13px;color:var(--muted-foreground);margin-left:2px;vertical-align:-1px}
  .cexcerpt{margin:0;color:var(--muted-foreground);font-size:13px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ctags{display:flex;gap:5px;flex-wrap:wrap}
  .ctag{font-size:11px;font-weight:600;color:var(--secondary-foreground);background:var(--secondary);
    padding:2px 8px;border-radius:999px}
  .cfoot{margin-top:auto;padding-top:11px;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted-foreground)}
  .cfoot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:64%}
  .cfoot .go{display:inline-flex;align-items:center;gap:3px}

  .empty{text-align:center;padding:80px 20px;color:var(--muted-foreground);font-size:14px}
  .empty i{font-size:34px;display:block;margin-bottom:10px;opacity:.6}

  @media (max-width:560px){
    .wrap{padding:0 16px}
    .grid{grid-template-columns:1fr}
    .hero{padding:32px 0 18px}
    .stats{gap:20px}
  }
</style>
<script>
  // 다크모드: 저장값 없으면 라이트 기본 (site-starter 와 동일: enableSystem=false, default light)
  (function(){try{if(localStorage.getItem('clip-theme-v2')==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
</script>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-in">
      <div class="brand"><span class="mark"></span><span>AI 클리핑</span></div>
      <button class="icon-btn" id="theme" aria-label="테마 전환" title="테마 전환 (D)"><i class="ri-moon-line"></i></button>
    </div>
  </header>

  <div class="wrap">
    <section class="hero">
      <p class="eyebrow">TECH BLOG · AI CLIPPING</p>
      <div class="hero-head">
        <h1>테크 블로그의 AI 이야기</h1>
        <span class="hero-meta" id="heroMeta"></span>
      </div>
      <p class="lead">국내 주요 테크 기업 기술 블로그에서 AI 관련 글만 자동으로 클리핑합니다.</p>
    </section>
  </div>

  <div class="toolbar">
    <div class="wrap toolbar-in">
      <div class="filterbar">
        <div class="chips scrollbar-none" id="chips"></div>
        <div class="search">
          <i class="ri-search-line"></i>
          <input id="q" type="search" placeholder="제목·내용·키워드 검색 (예: LLM, RAG, 추천)" autocomplete="off" />
        </div>
      </div>
      <div class="tagrow scrollbar-none" id="tagrow"></div>
    </div>
  </div>

  <main>
    <div class="wrap">
      <p class="count" id="count"></p>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">
        <i class="ri-search-line"></i>
        조건에 맞는 글이 없어요. 필터를 바꿔보세요.
      </div>
    </div>
  </main>

  <script src="./data.js"></script>
  <script>
  (function(){
    var DATA = window.CLIP_DATA || {posts:[],sources:[],generatedAt:""};
    var posts = DATA.posts || [];
    var state = {company:"all", q:"", tag:null};
    var root=document.documentElement;

    // ----- theme (light 기본, D 단축키) -----
    var tbtn=document.getElementById('theme');
    function paint(){ tbtn.innerHTML = root.classList.contains('dark') ? '<i class="ri-sun-line"></i>' : '<i class="ri-moon-line"></i>'; }
    function toggleTheme(){ root.classList.toggle('dark');
      try{localStorage.setItem('clip-theme-v2', root.classList.contains('dark')?'dark':'light');}catch(e){} paint(); }
    paint();
    tbtn.onclick=toggleTheme;
    document.addEventListener('keydown',function(e){
      if(e.defaultPrevented||e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
      if(e.key.toLowerCase()!=='d') return;
      var t=e.target;
      if(t&&(t.isContentEditable||t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')) return;
      toggleTheme();
    });

    // ----- meta -----
    var srcMeta={}; (DATA.sources||[]).forEach(function(s){srcMeta[s.id]=s;});
    function logoOf(id){return 'logos/'+id+'.png';}
    function textOn(hex){var c=(hex||'').replace('#','');if(c.length===3)c=c.replace(/./g,'$&$&');
      var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
      return (0.299*r+0.587*g+0.114*b)>170?'#1a1a1a':'#ffffff';}
    function tint(hex,a){return 'color-mix(in srgb,'+hex+' '+a+'%, var(--card))';}

    var companyCounts={}; posts.forEach(function(p){companyCounts[p.source]=(companyCounts[p.source]||0)+1;});
    var tagCounts={}; posts.forEach(function(p){(p.tags||[]).forEach(function(t){tagCounts[t]=(tagCounts[t]||0)+1;});});
    var DAY=86400000, now=Date.now();
    var newCount=posts.filter(function(p){return p.firstSeen&&(now-new Date(p.firstSeen))<7*DAY;}).length;

    var meta='총 <b>'+posts.length+'</b>건 · <b>'+Object.keys(companyCounts).length+'</b>개 기업';
    if(DATA.generatedAt){var d=new Date(DATA.generatedAt);
      meta+=" · 업데이트 '"+String(d.getFullYear()).slice(2)+"."+String(d.getMonth()+1).padStart(2,'0')+"."+String(d.getDate()).padStart(2,'0');}
    document.getElementById('heroMeta').innerHTML=meta;

    // ----- chips -----
    var chips=document.getElementById('chips');
    var order=(DATA.sources||[]).map(function(s){return s.id;}).filter(function(id){return companyCounts[id];});
    function chip(id,label,color,count){
      var b=document.createElement('button'); b.className='chip'+(state.company===id?' on':'');
      if(state.company===id){
        if(color){b.style.background=color;b.style.color=textOn(color);}
        else{b.style.background='var(--foreground)';b.style.color='var(--background)';}
      }
      var mark = (id&&id!=='all') ? '<img class="clogo" src="'+logoOf(id)+'" alt="" onerror="this.remove()">'
                 : (color?'<span class="cdot" style="background:'+color+'"></span>':'');
      b.innerHTML=mark+'<span>'+label+'</span><span class="cnt">'+count+'</span>';
      b.onclick=function(){state.company=id;render();}; return b;
    }
    function buildChips(){ chips.innerHTML='';
      chips.appendChild(chip('all','전체',null,posts.length));
      order.forEach(function(id){var m=srcMeta[id]||{};chips.appendChild(chip(id,m.name||id,m.color,companyCounts[id]));});
    }

    // ----- tags -----
    var tagrow=document.getElementById('tagrow');
    var topTags=Object.keys(tagCounts).sort(function(a,b){return tagCounts[b]-tagCounts[a];});
    function buildTags(){ tagrow.innerHTML='';
      topTags.forEach(function(t){var b=document.createElement('button');
        b.className='tagf'+(state.tag===t?' on':''); b.textContent='#'+t+' '+tagCounts[t];
        b.onclick=function(){state.tag=(state.tag===t?null:t);render();}; tagrow.appendChild(b);});
    }

    function fmtDate(iso){if(!iso)return'';var d=new Date(iso);if(isNaN(d))return'';
      var diff=(Date.now()-d)/DAY;
      if(diff<1)return'오늘'; if(diff<2)return'어제'; if(diff<8)return Math.floor(diff)+'일 전';
      return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
    function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

    var grid=document.getElementById('grid'),empty=document.getElementById('empty'),countEl=document.getElementById('count');
    function match(p){
      if(state.company!=='all'&&p.source!==state.company)return false;
      if(state.tag&&(p.tags||[]).indexOf(state.tag)<0)return false;
      if(state.q){var q=state.q.toLowerCase();
        if((p.title+' '+p.summary+' '+(p.tags||[]).join(' ')+' '+p.sourceName).toLowerCase().indexOf(q)<0)return false;}
      return true;
    }
    function render(){
      buildChips(); buildTags();
      var list=posts.filter(match);
      list.sort(function(a,b){return (b.date||'')<(a.date||'')?-1:((b.date||'')>(a.date||'')?1:0);});
      countEl.innerHTML='<b>'+list.length+'</b>건'+
        (state.company!=='all'?' · '+(srcMeta[state.company]||{}).name:'')+
        (state.tag?' · #'+state.tag:'')+(state.q?' · "'+esc(state.q)+'"':'');
      empty.style.display=list.length?'none':'block';
      grid.innerHTML='';
      var frag=document.createDocumentFragment();
      list.forEach(function(p){
        var color=p.color||'#888';
        var isNew=p.date&&(Date.now()-new Date(p.date))<3*DAY;   // 발행일 기준 3일 이내
        var el=document.createElement('article'); el.className='card';
        el.onclick=function(){if(p.url)window.open(p.url,'_blank','noopener');};
        var initial=esc((p.sourceName||'?').slice(0,2));
        var thumb=
          '<div class="ph" style="background:'+tint(color,10)+'"><span style="color:'+color+'">'+initial+'</span></div>'+
          (p.image?'<img loading="lazy" src="'+esc(p.image)+'" onerror="this.remove()" alt="">':'')+
          '<span class="badge"><img class="clogo" src="'+logoOf(p.source)+'" alt="" onerror="this.remove()">'+esc(p.sourceName)+'</span>'+
          (isNew?'<span class="new">NEW</span>':'');
        var tags=(p.tags||[]).slice(0,3).map(function(t){return '<span class="ctag">'+esc(t)+'</span>';}).join('');
        el.innerHTML=
          '<div class="thumb">'+thumb+'</div>'+
          '<div class="cbody">'+
            '<h3 class="ctitle">'+esc(p.title)+'<i class="ri-external-link-line"></i></h3>'+
            (p.summary?'<p class="cexcerpt">'+esc(p.summary)+'</p>':'')+
            (tags?'<div class="ctags">'+tags+'</div>':'')+
            '<div class="cfoot"><span class="who">'+(p.author?esc(p.author)+' · ':'')+fmtDate(p.date)+'</span>'+
            '<span class="go">원문 <i class="ri-arrow-right-up-line"></i></span></div>'+
          '</div>';
        frag.appendChild(el);
      });
      grid.appendChild(frag);
    }

    var qi=document.getElementById('q'),t;
    qi.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){state.q=qi.value.trim();render();},110);});
    render();
  })();
  </script>
</body>
</html>
