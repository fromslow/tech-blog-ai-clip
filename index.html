<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>테크 블로그 AI 클리핑</title>
<script>
  // 깜빡임 방지: 저장된 테마가 있으면 즉시 적용, 없으면 라이트 기본
  (function(){try{var s=localStorage.getItem('clip-theme');document.documentElement.setAttribute('data-theme', s||'light');}catch(e){}})();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" />
<style>
  :root{
    --bg:#09090b; --bg-2:#0f0f13; --surface:#141419; --surface-2:#1a1a21;
    --border:#25252e; --border-2:#33333f;
    --text:#f4f4f6; --text-2:#a2a2af; --text-3:#68687600;
    --muted:#9a9aa8; --faint:#63636f;
    --accent:#6b8afd; --accent-2:#a78bfa;
    --chip:#1c1c23; --chip-text:#c9c9d4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.45);
    --shadow-hover:0 8px 24px rgba(0,0,0,.5), 0 28px 60px rgba(0,0,0,.6);
    --thumb-fade:rgba(255,255,255,.16);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#fbfbfd; --bg-2:#f3f3f6; --surface:#ffffff; --surface-2:#f7f7fa;
    --border:#ececef; --border-2:#e0e0e6;
    --text:#131319; --text-2:#5b5b67;
    --muted:#6b6b78; --faint:#9a9aa6;
    --accent:#3b5bf5; --accent-2:#7c5cf6;
    --chip:#f0f0f4; --chip-text:#3d3d48;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 30px rgba(16,24,40,.07);
    --shadow-hover:0 6px 16px rgba(16,24,40,.1), 0 22px 50px rgba(16,24,40,.13);
    --thumb-fade:rgba(255,255,255,.5);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Wanted Sans Variable","Wanted Sans",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5; letter-spacing:-.01em;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}

  /* ---------- Nav ---------- */
  nav{position:sticky;top:0;z-index:40;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(160%) blur(16px);
    border-bottom:1px solid var(--border)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16.5px;letter-spacing:-.02em}
  .brand .logo{width:26px;height:26px;border-radius:8px;
    background:conic-gradient(from 200deg,#6b8afd,#a78bfa,#34d399,#fb923c,#6b8afd);
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 4px 14px rgba(107,138,253,.35)}
  .nav-r{display:flex;align-items:center;gap:6px}
  .icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;
    border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:.15s}
  .icon-btn:hover{color:var(--text);border-color:var(--border-2)}

  /* ---------- Hero ---------- */
  header.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
  .hero-glow{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(560px 300px at 12% 0%, rgba(107,138,253,.28), transparent 65%),
      radial-gradient(520px 280px at 78% 8%, rgba(167,139,250,.22), transparent 62%),
      radial-gradient(500px 300px at 95% 60%, rgba(52,211,153,.14), transparent 60%),
      radial-gradient(420px 260px at 30% 90%, rgba(251,146,60,.12), transparent 60%)}
  .hero-in{position:relative;padding-top:64px;padding-bottom:40px}
  .shapes{display:flex;gap:12px;margin-bottom:26px}
  .shape{width:38px;height:38px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
  .shape.s1{border-radius:12px;background:linear-gradient(140deg,#6b8afd,#22d3ee)}
  .shape.s2{border-radius:50%;background:linear-gradient(140deg,#a78bfa,#ec4899)}
  .shape.s3{border-radius:14px 14px 14px 40px;background:linear-gradient(140deg,#34d399,#10b981)}
  .shape.s4{border-radius:50% 50% 12px 12px;background:linear-gradient(140deg,#fb923c,#f59e0b)}
  .shape.s5{border-radius:12px;transform:rotate(45deg);background:linear-gradient(140deg,#f472b6,#a78bfa)}
  .eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin:0 0 14px}
  h1{margin:0 0 16px;font-size:clamp(34px,5.4vw,60px);font-weight:800;line-height:1.05;letter-spacing:-.035em}
  h1 .grad{background:linear-gradient(100deg,#6b8afd,#a78bfa 45%,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{margin:0;color:var(--muted);font-size:clamp(15px,1.6vw,18px);max-width:620px;line-height:1.6}
  .stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
  .stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:12.5px;color:var(--faint);margin-top:2px}

  /* ---------- Toolbar ---------- */
  .toolbar{position:sticky;top:60px;z-index:30;
    background:color-mix(in srgb,var(--bg) 85%,transparent);
    backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--border);padding:14px 0}
  .searchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--border-2);
    border-radius:13px;background:var(--surface);color:var(--text);font-size:14.5px;outline:none;
    font-family:inherit;transition:.15s}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .sort{display:flex;gap:3px;background:var(--chip);padding:4px;border-radius:12px;border:1px solid var(--border)}
  .sort button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
    padding:8px 13px;border-radius:9px;cursor:pointer}
  .sort button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}

  /* 칩·태그: 항상 한 줄 가로 스크롤 (툴바가 세로로 커지지 않게) */
  .chips,.tagrow{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar,.tagrow::-webkit-scrollbar{display:none}
  .chips{gap:8px;margin-top:12px;padding-bottom:2px}
  .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-2);
    background:var(--surface);color:var(--chip-text);font:inherit;font-size:13px;font-weight:600;
    padding:8px 13px;border-radius:999px;cursor:pointer;transition:.14s;white-space:nowrap}
  .chip:hover{border-color:var(--faint);color:var(--text)}
  .chip .cdot{width:9px;height:9px;border-radius:50%}
  .chip .cnt{color:var(--faint);font-weight:700;font-size:12px}
  .chip.on{color:#fff;border-color:transparent}
  .chip.on .cnt{color:rgba(255,255,255,.85)} .chip.on .cdot{background:#fff!important}
  /* 회사 로고 미니 타일 (동그라미 대체) */
  .clogo{width:18px;height:18px;border-radius:5px;object-fit:contain;background:#fff;
    padding:1px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06)}

  .tagrow{gap:7px;margin-top:10px;padding-bottom:2px}
  .tagf{flex-shrink:0;border:1px solid transparent;background:var(--chip);color:var(--muted);font:inherit;
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;transition:.14s}
  .tagf:hover{color:var(--text)}
  .tagf.on{background:var(--text);color:var(--bg)}

  /* ---------- Grid ---------- */
  main{padding:30px 0 70px}
  .count{color:var(--muted);font-size:14px;margin:0 0 20px}
  .count b{color:var(--text);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);
    border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--border-2)}
  .thumb{position:relative;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center}
  .thumb .ph{position:absolute;inset:0;display:grid;place-items:center}
  .thumb .ph b{font-size:30px;font-weight:800;color:var(--thumb-fade);letter-spacing:-.02em;
    text-shadow:0 2px 10px rgba(0,0,0,.15)}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:transform .4s ease;background:var(--surface-2)}
  .card:hover .thumb img{transform:scale(1.05)}
  .thumb .badge{position:absolute;left:12px;top:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:8px;color:#fff;
    background:rgba(0,0,0,.42);backdrop-filter:blur(6px)}
  .thumb .badge .cdot{width:8px;height:8px;border-radius:50%}
  .thumb .new{position:absolute;right:12px;top:12px;z-index:2;font-size:10.5px;font-weight:800;
    letter-spacing:.03em;padding:4px 8px;border-radius:7px;color:#0a0a0c;
    background:linear-gradient(120deg,#6b8afd,#34d399)}
  .cbody{padding:16px 17px 15px;display:flex;flex-direction:column;gap:10px;flex:1}
  .ctitle{margin:0;font-size:16px;font-weight:750;line-height:1.4;letter-spacing:-.015em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card:hover .ctitle{color:var(--accent)}
  .cexcerpt{margin:0;color:var(--muted);font-size:13px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ctags{display:flex;gap:6px;flex-wrap:wrap}
  .ctag{font-size:11px;font-weight:700;color:var(--chip-text);background:var(--chip);padding:3px 8px;border-radius:6px}
  .cfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--faint)}
  .cfoot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
  .cfoot .go{color:var(--muted);font-weight:600}

  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty .big{font-size:42px;margin-bottom:10px}

  footer.f{border-top:1px solid var(--border);padding:30px 0 44px;color:var(--faint);font-size:12.5px;line-height:1.7}
  footer.f code{background:var(--chip);padding:2px 7px;border-radius:6px;color:var(--chip-text)}
  footer.f b{color:var(--text-2)}

  @media (max-width:560px){
    .grid{grid-template-columns:1fr}
    .sort{display:none}
    .hero-in{padding-top:44px;padding-bottom:30px}
    .stats{gap:20px}
    .wrap{padding:0 20px}       /* 좁은 화면에서도 좌우 여백 유지 */
    .toolbar{padding:12px 0}
  }
</style>
</head>
<body>
  <nav>
    <div class="wrap nav-in">
      <div class="brand"><span class="logo"></span><span>AI 클리핑</span></div>
      <div class="nav-r">
        <button class="icon-btn" id="theme" title="테마 전환" aria-label="테마 전환"></button>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-glow"></div>
    <div class="wrap hero-in">
      <div class="shapes" aria-hidden="true">
        <span class="shape s1"></span><span class="shape s2"></span><span class="shape s3"></span>
        <span class="shape s4"></span><span class="shape s5"></span>
      </div>
      <p class="eyebrow">TECH BLOG · AI CLIPPING</p>
      <h1>테크 블로그의<br><span class="grad">AI 이야기</span>만 모아서</h1>
      <p class="lead">국내 주요 테크 기업 기술 블로그에서 AI 관련 글만 자동으로 클리핑합니다.</p>
      <div class="stats">
        <div class="stat"><div class="n" id="sTotal">–</div><div class="l">클리핑된 AI 글</div></div>
        <div class="stat"><div class="n" id="sCos">–</div><div class="l">테크 기업</div></div>
        <div class="stat"><div class="n" id="sNew">–</div><div class="l">최근 7일 신규</div></div>
        <div class="stat"><div class="n" id="sDate">–</div><div class="l">마지막 업데이트</div></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap">
      <div class="searchrow">
        <div class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="제목·내용·키워드 검색 (예: LLM, RAG, 추천)" autocomplete="off" />
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="tagrow" id="tagrow"></div>
    </div>
  </div>

  <main>
    <div class="wrap">
      <p class="count" id="count"></p>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">
        <div class="big">🔍</div>
        <div>조건에 맞는 글이 없어요. 필터를 바꿔보세요.</div>
      </div>
    </div>
  </main>


  <script src="./data.js"></script>
  <script>
  (function(){
    var DATA = window.CLIP_DATA || {posts:[],sources:[],generatedAt:""};
    var posts = DATA.posts || [];
    var state = {company:"all", q:"", tag:null, sort:"latest"};

    // ----- theme -----
    var root=document.documentElement, tbtn=document.getElementById('theme');
    function setTheme(t){ root.setAttribute('data-theme',t); try{localStorage.setItem('clip-theme',t);}catch(e){}
      tbtn.innerHTML = t==='dark'
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
    }
    (function initTheme(){ var s=null; try{s=localStorage.getItem('clip-theme');}catch(e){}
      setTheme(s || 'light');   // 저장된 선택이 없으면 라이트 기본
    })();
    tbtn.onclick=function(){ setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); };

    // ----- source meta -----
    var srcMeta={}; (DATA.sources||[]).forEach(function(s){srcMeta[s.id]=s;});
    function tint(hex,a){return 'color-mix(in srgb,'+hex+' '+a+'%,transparent)';}
    function lighten(hex){return 'color-mix(in srgb,'+hex+' 62%, #ffffff)';}
    function logoOf(id){return 'logos/'+id+'.png';}
    // 밝은 브랜드색(카카오 노랑 등) 위에는 어두운 글자
    function textOn(hex){var c=(hex||'').replace('#','');if(c.length===3)c=c.replace(/./g,'$&$&');
      var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
      return (0.299*r+0.587*g+0.114*b)>170?'#1a1a1a':'#ffffff';}

    // ----- counts -----
    var companyCounts={}; posts.forEach(function(p){companyCounts[p.source]=(companyCounts[p.source]||0)+1;});
    var tagCounts={}; posts.forEach(function(p){(p.tags||[]).forEach(function(t){tagCounts[t]=(tagCounts[t]||0)+1;});});
    var now=Date.now(), DAY=86400000;
    var newCount=posts.filter(function(p){return p.firstSeen && (now-new Date(p.firstSeen))<7*DAY;}).length;

    document.getElementById('sTotal').textContent=posts.length;
    document.getElementById('sCos').textContent=Object.keys(companyCounts).length;
    document.getElementById('sNew').textContent=newCount;
    if(DATA.generatedAt){var d=new Date(DATA.generatedAt);
      var yy=String(d.getFullYear()).slice(2), mm=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
      document.getElementById('sDate').textContent="'"+yy+"."+mm+"."+dd;}

    // ----- chips -----
    var chips=document.getElementById('chips');
    var order=(DATA.sources||[]).map(function(s){return s.id;}).filter(function(id){return companyCounts[id];});
    function chip(id,label,color,count){
      var b=document.createElement('button'); b.className='chip'+(state.company===id?' on':'');
      if(state.company===id){                      // 활성 칩 배경
        if(color){ b.style.background=color; b.style.color=textOn(color); }
        else { b.style.background='var(--accent)'; b.style.color='#fff'; }  // '전체'는 브랜드색이 없으므로 accent
      }
      var mark = (id && id!=='all')
        ? '<img class="clogo" src="'+logoOf(id)+'" alt="" onerror="this.remove()">'
        : (color?'<span class="cdot" style="background:'+color+'"></span>':'');
      b.innerHTML=mark+'<span>'+label+'</span><span class="cnt">'+count+'</span>';
      b.onclick=function(){state.company=id;render();}; return b;
    }
    function buildChips(){ chips.innerHTML='';
      chips.appendChild(chip('all','전체',null,posts.length));
      order.forEach(function(id){var m=srcMeta[id]||{};chips.appendChild(chip(id,m.name||id,m.color,companyCounts[id]));});
    }

    // ----- tag filters -----
    var tagrow=document.getElementById('tagrow');
    var topTags=Object.keys(tagCounts).sort(function(a,b){return tagCounts[b]-tagCounts[a];});
    function buildTags(){ tagrow.innerHTML='';
      topTags.forEach(function(t){var b=document.createElement('button');
        b.className='tagf'+(state.tag===t?' on':''); b.textContent='#'+t+' '+tagCounts[t];
        b.onclick=function(){state.tag=(state.tag===t?null:t);render();}; tagrow.appendChild(b);});
    }

    function fmtDate(iso){ if(!iso)return''; var d=new Date(iso); if(isNaN(d))return'';
      var diff=(Date.now()-d)/DAY;
      if(diff<1)return'오늘'; if(diff<2)return'어제'; if(diff<8)return Math.floor(diff)+'일 전';
      return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
    }
    function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

    var grid=document.getElementById('grid'), empty=document.getElementById('empty'), countEl=document.getElementById('count');
    function match(p){
      if(state.company!=='all' && p.source!==state.company) return false;
      if(state.tag && (p.tags||[]).indexOf(state.tag)<0) return false;
      if(state.q){var q=state.q.toLowerCase();
        if((p.title+' '+p.summary+' '+(p.tags||[]).join(' ')+' '+p.sourceName).toLowerCase().indexOf(q)<0) return false;}
      return true;
    }
    function render(){
      buildChips(); buildTags();
      var list=posts.filter(match);
      list.sort(function(a,b){return (b.date||'')<(a.date||'')?-1:((b.date||'')>(a.date||'')?1:0);});

      countEl.innerHTML='<b>'+list.length+'</b>건'+
        (state.company!=='all'?' · '+(srcMeta[state.company]||{}).name:'')+
        (state.tag?' · #'+state.tag:'')+(state.q?' · "'+esc(state.q)+'"':'');
      empty.style.display=list.length?'none':'block';
      grid.innerHTML='';
      var frag=document.createDocumentFragment();
      list.forEach(function(p){
        var color=p.color||'#888';
        var isNew=p.firstSeen && (Date.now()-new Date(p.firstSeen))<3*DAY;
        var el=document.createElement('article'); el.className='card';
        el.onclick=function(){if(p.url)window.open(p.url,'_blank','noopener');};
        var initial=esc((p.sourceName||'?').slice(0,2));
        var thumbInner=
          '<div class="ph" style="background:linear-gradient(140deg,'+color+','+lighten(color)+')"><b>'+initial+'</b></div>'+
          (p.image?'<img loading="lazy" src="'+esc(p.image)+'" onerror="this.remove()" alt="">':'')+
          '<span class="badge" style="background:'+color+';color:'+textOn(color)+'">'+esc(p.sourceName)+'</span>'+
          (isNew?'<span class="new">NEW</span>':'');
        var tags=(p.tags||[]).slice(0,3).map(function(t){return '<span class="ctag">'+esc(t)+'</span>';}).join('');
        el.innerHTML=
          '<div class="thumb">'+thumbInner+'</div>'+
          '<div class="cbody">'+
            '<h3 class="ctitle">'+esc(p.title)+'</h3>'+
            (p.summary?'<p class="cexcerpt">'+esc(p.summary)+'</p>':'')+
            (tags?'<div class="ctags">'+tags+'</div>':'')+
            '<div class="cfoot"><span class="who">'+(p.author?esc(p.author)+' · ':'')+fmtDate(p.date)+'</span>'+
            '<span class="go">원문 ↗</span></div>'+
          '</div>';
        frag.appendChild(el);
      });
      grid.appendChild(frag);
    }

    var qi=document.getElementById('q'), t;
    qi.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){state.q=qi.value.trim();render();},110);});

    render();
  })();
  </script>
</body>
</html>
